<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clear Path parent comparison — synthetic data</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#F6F7FB;color:#172033;font:18px/1.6 system-ui,sans-serif}h1{font-size:28px}label{display:inline-flex;flex-direction:column;gap:4px;margin:0 16px 16px 0;font-weight:600}select,a{min-height:48px;padding:8px;border:2px solid #7A8496;border-radius:12px;background:#fff;color:#172033;font:inherit}select:focus-visible,a:focus-visible{outline:4px solid #1E55C8;outline-offset:3px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{font-weight:700;margin-bottom:12px}.image{max-height:75vh;overflow:auto;border:2px solid #D5DAE5;border-radius:24px;background:white}img{display:block;width:100%;height:auto}a{display:inline-flex;align-items:center;margin-top:12px}small{display:block;margin-bottom:20px}@media(max-width:700px){.compare{grid-template-columns:1fr}body{padding:16px}}
</style>
<h1>Clear Path parent screens</h1><p>Synthetic data only. Fetched main <code>ff97190e</code> compared with PR A, <code>redesign/11-parent</code>.</p>
<label>View<select id="view"></select></label><label>Appearance<select id="theme"><option value="standard">Standard</option><option value="dark">Dark</option><option value="contrast">High contrast</option></select></label><label>Width<select id="width"><option>1280</option><option>390</option></select></label>
<small>Full-page screenshots scroll independently. The Activity Timeline is included in Monitoring overview. All values, names and parent codes are synthetic.</small>
<div class="compare"><figure><figcaption>Before — fetched main</figcaption><div class="image"><img id="before" alt="Before parent screen"></div><a id="before-link" target="_blank" rel="noopener">Open full-size before image</a></figure><figure><figcaption>After — Clear Path</figcaption><div class="image"><img id="after" alt="After parent screen"></div><a id="after-link" target="_blank" rel="noopener">Open full-size after image</a></figure></div>
<script>
const views={home:'Parent home',dashboard:'Parent Dashboard dialog',monitoring:'Monitoring overview + Activity Timeline',progress:'Learning Progress',insights:'Learning Insights',leaderboard:'Leaderboard',reports:'Reports',settings:'Settings & Actions',struggle:'Struggle Alert',create:'Create child / empty monitoring',preview:'Child preview dialog','reset-confirm':'Reset confirmation',curriculum:'Expanded curriculum','generated-report':'Generated report','user-menu':'Parent user menu',notification:'Progress notification','empty-home':'Empty parent home','empty-dashboard':'No learner selected','welcome-dismissed':'Welcome dismissed'};
const view=document.getElementById('view'),theme=document.getElementById('theme'),width=document.getElementById('width');
for(const[value,label]of Object.entries(views)){const option=document.createElement('option');option.value=value;option.textContent=label;view.append(option)}
function update(){for(const stage of ['before','after']){const src=`${stage}-${view.value}-${theme.value}-${width.value}.jpg`;document.getElementById(stage).src=src;document.getElementById(stage).alt=`${stage}: ${views[view.value]}, ${theme.selectedOptions[0].text}, ${width.value}px`;document.getElementById(stage+'-link').href=src}}
for(const select of [view,theme,width])select.addEventListener('change',update);update();
</script></html>
